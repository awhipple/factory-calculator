<html>

<head>
    <style>
        .controls {
            overflow: hidden;
            background-color: #BBB;
            position: fixed;
            top: 0;
            width: 100%;
            padding: 5px;
            border: 2px solid black;
        }
        
        h3 {
            margin-bottom: 0px;
        }
        
        .item_details {
            display: flex
        }
        
        #materials {
            margin-top: 50px;
        }
        
        #craft_tree {
            margin-top: 50px;
            margin-left: 100px;
        }
        
        #graph {
            margin-top: 50px;
            margin-left: 100px;
            width: 60vw;
            height: 80vh;
        }
        
        .button {
            display: inline;
            width: 10px;
            height: 10px;
            border: 1px solid black;
            cursor: pointer;
            margin-right: 10px;
        }
        
        .button:before {
            color: #000;
            font-weight: 300;
            font-family: Arial, sans-serif;
        }
        
        .show.button {
            background: lightgreen;
        }
        
        .show.button:before {
            content: ' + ';
        }
        
        .hide.button {
            background: gray;
        }
        
        .hide.button:before {
            content: ' x ';
        }
    </style>

    <script src="./sigma/sigma.min.js"></script>
    <script src="./sigma/plugins/sigma.layout.forceAtlas2.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.js"></script>
    <script src='./calculator.js'></script>
</head>

<body>
    <div class="controls">
        <select id="game_select"></select>
        <select id="item_select">
            <option></option>
        </select>
        <input id="items_per_sec" placeholder="Items Per Sec (Default: 1)" />
        <br />
        <input type="checkbox" id="show_material_details" /> Show Material Details
    </div>
    <div class="item_details">
        <div>
            <pre id="materials"></pre>
        </div>
        <div>
            <pre id="craft_tree"></pre>
        </div>
        <div>
            <pre id="graph"></pre>
        </div>
    </div>
</body>

</html>
