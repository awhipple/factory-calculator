<html>

<head>
    <style>
        /* ---------- DSP-style page theme ----------
           Same palette and visual rhythm as the .picker-panel below: very
           dark navy background, gold (#d4a64a) for accents/headers, light
           blue text (#d4e6ff), cyan (#5cc7ff) for hover/focus. The
           materials readout stays monospace (column alignment in the JS
           rendering needs it); the rest is system sans-serif. */
        /* Body owns the viewport — flex column with the controls at top
           and the item_details flex-grown to fill the rest. Nothing
           overflows the viewport (the "few pixels of scroll" symptom was
           the fixed controls + 80vh graph + paddings exceeding 100vh by
           a hair); internal scroll happens inside individual panels. */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background: #06121f;
            color: #d4e6ff;
            font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;

            /* Sprite per active game. calculator.js overrides these in
               load_game() before any icons are rendered; the values here
               just make the CSS valid in isolation (and pick a sane
               fallback if a game has no sprite configured).
               --sprite-natural-w is unitless so we can plug it into
               calc() expressions — every sprite the calculator uses is
               square (NxN), so a single dimension is enough. The cells
               in every factoriolab sprite are 64px (with the SA sheet
               adding 2px gaps that fall inside the unrendered area of
               each tile, so the 64px reference still works). */
            --sprite-url: url('data/sources/factoriolab-dsp/icons.webp');
            --sprite-natural-w: 1472;
        }

        .controls {
            flex-shrink: 0;
            padding: 12px 18px;
            background: linear-gradient(180deg, #142c44, #0a1828);
            color: #d4e6ff;
            border-bottom: 1px solid #1f3a5a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .controls select,
        .controls input[type="text"],
        .controls input[type="number"],
        .controls input:not([type]) {
            background: #0c1f33;
            color: #d4e6ff;
            border: 1px solid #1f3a5a;
            border-radius: 3px;
            padding: 5px 9px;
            font: inherit;
            font-size: 13px;
        }
        .controls select:focus,
        .controls input:focus {
            outline: none;
            border-color: #5cc7ff;
            box-shadow: 0 0 8px rgba(92, 199, 255, 0.35);
        }
        .controls input[type="checkbox"] {
            accent-color: #d4a64a;
            margin: 0 4px 0 14px;
        }
        .controls label,
        .controls .controls-text {
            color: #6b8aa8;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        /* The br in the controls used to wrap rows; flex-wrap handles it
           cleanly now, and we let the br become a full row break with
           flex-basis:100%. */
        .controls br { flex-basis: 100%; height: 0; }

        /* Fills the remaining viewport height. Both children stretch full
           height; internal scroll is per-panel. */
        .item_details {
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 16px;
            padding: 16px;
            overflow: hidden;
        }

        /* Panels: same dark navy + subtle border + soft inner shadow as the
           picker, so the page feels like a single connected UI. */
        #recipe_picker, #graph {
            background: #0a1828;
            border: 1px solid #1f3a5a;
            border-radius: 4px;
            box-shadow: 0 2px 18px rgba(0, 6, 18, 0.45);
            margin: 0;
        }
        #recipe_picker {
            flex: 0 0 320px;
            padding: 14px 18px;
            color: #d4e6ff;
            overflow: auto;
        }

        /* Dark scrollbars on every internally-scrolling panel so the
           browser default doesn't pop against the navy theme. Firefox
           uses scrollbar-width + scrollbar-color; WebKit/Blink uses the
           ::-webkit-scrollbar pseudo-elements. Both target the same
           selector list. */
        #recipe_picker,
        .picker-grid,
        .picker-side {
            scrollbar-width: thin;
            scrollbar-color: #2c4a6a #0a1828;
        }
        #recipe_picker::-webkit-scrollbar,
        .picker-grid::-webkit-scrollbar,
        .picker-side::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        #recipe_picker::-webkit-scrollbar-track,
        .picker-grid::-webkit-scrollbar-track,
        .picker-side::-webkit-scrollbar-track {
            background: #0a1828;
        }
        #recipe_picker::-webkit-scrollbar-thumb,
        .picker-grid::-webkit-scrollbar-thumb,
        .picker-side::-webkit-scrollbar-thumb {
            background: #2c4a6a;
            border-radius: 5px;
            border: 2px solid #0a1828;  /* inset for a "track gap" look */
        }
        #recipe_picker::-webkit-scrollbar-thumb:hover,
        .picker-grid::-webkit-scrollbar-thumb:hover,
        .picker-side::-webkit-scrollbar-thumb:hover {
            background: #3a5a7a;
        }
        /* Hide the corner square where vertical+horizontal scrollbars
           meet so it doesn't show as a light browser-default chip. */
        #recipe_picker::-webkit-scrollbar-corner,
        .picker-grid::-webkit-scrollbar-corner,
        .picker-side::-webkit-scrollbar-corner {
            background: #0a1828;
        }

        /* Recipe picker cards — one per item that has alternatives. Each
           card stacks: item name (gold subheader), then a radio group of
           recipe options. The selected option gets a brighter border and
           an accent left-stripe. */
        .rp-item {
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1a2e44;
        }
        .rp-item:last-child { border-bottom: none; margin-bottom: 0; }
        .rp-item-name {
            color: #d4a64a;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: capitalize;
            margin: 0 0 8px;
        }
        .rp-option {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            padding: 7px 9px;
            border: 1px solid transparent;
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background .12s, border-color .12s;
        }
        .rp-option:hover { background: #0e1f33; }
        .rp-option.selected {
            background: #0e2a44;
            border-color: #2c4a6a;
            box-shadow: inset 3px 0 0 #d4a64a;
        }
        .rp-option input[type="radio"] {
            margin: 3px 0 0;
            accent-color: #d4a64a;
            flex-shrink: 0;
        }
        .rp-option-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .rp-recipe-id {
            color: #d4e6ff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .rp-recipe-summary {
            color: #6b8aa8;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }
        .rp-mats-line {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-top: 2px;
        }
        .rp-mats-line .rp-mat {
            color: #b4c8de;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }
        .rp-byproducts .rp-byp-label {
            color: #6b8aa8;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 6px;
        }
        .rp-byproducts .rp-mat { color: #ffe066; }
        .rp-hint {
            color: #6b8aa8;
            font-size: 12px;
            font-style: italic;
            text-align: center;
            margin: 20px 8px;
        }
        /* #graph is a flex column: h2 header at top, .graph-canvas fills
           the remainder (sigma renders into that, NOT directly into #graph,
           so the h2 padding doesn't get overdrawn). overflow:hidden clips
           any forceAtlas2 layout that pushes nodes past the panel.
           position:relative anchors the absolutely-placed .graph-legend. */
        #graph {
            flex: 1;
            min-width: 0;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .graph-canvas {
            flex: 1;
            min-height: 0;
            position: relative;  /* sigma's absolute-positioned canvas */
        }

        /* Tooltip shown while hovering a graph node. Sits on the body so
           it can extend past the #graph panel's overflow:hidden bounds;
           pointer-events:none keeps it from eating clicks meant for the
           canvas underneath. Populated by render_picker_side-style HTML
           assembled in calculator.js (show_node_tooltip). */
        .node-tooltip {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            background: #0c1f33;
            border: 1px solid #1f3a5a;
            border-radius: 3px;
            padding: 10px 12px;
            color: #d4e6ff;
            font-size: 12px;
            line-height: 1.45;
            max-width: 280px;
            box-shadow: 0 6px 22px rgba(0, 6, 18, 0.65);
        }
        .node-tooltip[hidden] { display: none; }
        .node-tooltip-name {
            color: #d4a64a;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            margin: 0 0 6px;
            text-transform: capitalize;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* Icons rendered from the active game's sprite sheet (set on
           body via --sprite-url / --sprite-natural-w). Each instance sets
           its own background-position inline, scaled in JS by the cell
           ratio. Header is 32px (half native cell), inline ones in
           buildings/byproducts rows are 20px (~0.3125 native).
           background-size scales the whole sprite proportionally so the
           chosen 64-px-cell lands at the rendered size. */
        .node-tooltip-icon {
            width: 32px;
            height: 32px;
            background-image: var(--sprite-url);
            background-repeat: no-repeat;
            background-size: calc(var(--sprite-natural-w) * 0.5px) calc(var(--sprite-natural-w) * 0.5px);
            border: 1px solid #1f3a5a;
            border-radius: 2px;
            background-color: #0d1f33;
            flex-shrink: 0;
        }
        .node-tooltip-inline-icon {
            width: 20px;
            height: 20px;
            background-image: var(--sprite-url);
            background-repeat: no-repeat;
            background-size: calc(var(--sprite-natural-w) * 20 / 64 * 1px) calc(var(--sprite-natural-w) * 20 / 64 * 1px);
            border-radius: 2px;
            background-color: #0d1f33;
            flex-shrink: 0;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }
        .node-tooltip-row {
            display: flex;
            justify-content: space-between;
            align-items: center;  /* center text + inline icons vertically */
            gap: 16px;
        }
        .node-tooltip-row .key { color: #6b8aa8; }
        .node-tooltip-row .val { color: #d4e6ff; font-variant-numeric: tabular-nums; }
        .node-tooltip-row .val.accent { color: #d4a64a; }
        .node-tooltip-section {
            color: #6b8aa8;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.3px;
            margin: 8px 0 4px;
            border-top: 1px solid #1f3a5a;
            padding-top: 6px;
        }
        .node-tooltip-tag {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 8px;
            border-radius: 2px;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .node-tooltip-tag.raw       { background: #1f3a2a; color: #5cf089; }
        .node-tooltip-tag.collapsed { background: #3a3013; color: #ffe066; }

        /* Color legend pinned bottom-right of the graph panel. <details>
           gives us collapse for free; swatch colors are hardcoded to match
           GRAPH_COLOR_* in calculator.js (kept in sync by hand — small
           enough that a CSS-var refactor isn't worth the indirection). */
        .graph-legend {
            position: absolute;
            right: 14px;
            bottom: 14px;
            z-index: 5;
            background: rgba(10, 24, 40, 0.92);
            border: 1px solid #1f3a5a;
            border-radius: 3px;
            color: #d4e6ff;
            font-size: 13px;
            min-width: 170px;
        }
        .graph-legend summary {
            cursor: pointer;
            padding: 7px 12px;
            color: #6b8aa8;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            list-style: none;
            user-select: none;
        }
        .graph-legend summary::-webkit-details-marker { display: none; }
        .graph-legend summary::marker { content: ''; }
        .graph-legend summary::before {
            content: '\25B8 ';   /* ▸ — flips to ▾ when open below */
            display: inline-block;
        }
        .graph-legend[open] summary {
            border-bottom: 1px solid #1f3a5a;
            color: #d4a64a;
        }
        .graph-legend[open] summary::before { content: '\25BE '; }  /* ▾ */
        .graph-legend-body {
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .legend-swatch {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
            display: inline-block;
        }

        /* Shared header row used by both panels — flex layout so an h2 +
           optional controls (today: graph's reload button) sit on one
           line. min-height matches the reload button so a header with
           just an h2 reserves the same vertical space and the underline
           lines up across both panels. */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 28px;
            margin: 0 0 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1f3a5a;
        }
        .panel-header h2 {
            color: #d4a64a;
            font: 700 13px/1 system-ui, -apple-system, sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0;
            padding: 0;
            border: none;
        }
        .graph-reload {
            background: #0c1f33;
            color: #d4e6ff;
            border: 1px solid #1f3a5a;
            border-radius: 3px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .graph-reload:hover {
            background: #142c44;
            border-color: #5cc7ff;
            box-shadow: 0 0 8px rgba(92, 199, 255, 0.35);
        }
        #materials h3 {
            color: #d4a64a;
            font: 600 11px/1 system-ui, -apple-system, sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 16px 0 6px;
        }

        /* Show/hide material buttons — squared, themed. */
        .button {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 1px solid #1f3a5a;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
            vertical-align: middle;
            line-height: 12px;
            text-align: center;
            font: 12px/12px system-ui, -apple-system, sans-serif;
            font-weight: 600;
        }
        .button:before { font-weight: 600; }
        .show.button { background: #1f3a2a; color: #6acf6a; }
        .show.button:before { content: '+'; }
        .hide.button { background: #1f3a5a; color: #d4e6ff; }
        .hide.button:before { content: '×'; }

        /* ---------- DSP-style item picker ---------- */
        /* The icon button next to the dropdown that opens the picker. Hidden
           unless the active game has a picker layout configured (today: DSP). */
        /* Current-selection badge — the picker entry point for games with
           a graphical picker (DSP). Sprite icon + item name + ▾ chevron.
           Clickable; opens the picker. Hidden in dropdown-only games. */
        #current_selection {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 2px 12px 2px 4px;
            background: #0c1f33;
            color: #d4e6ff;
            border: 1px solid #1f3a5a;
            border-radius: 3px;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            min-height: 30px;
        }
        #current_selection:hover {
            background: #142c44;
            border-color: #5cc7ff;
            box-shadow: 0 0 8px rgba(92, 199, 255, 0.35);
        }
        #current_selection[hidden] { display: none; }
        /* 24px sprite cell (sprite-natural-w * 24/64). visibility:hidden
           (not display:none) when no item is selected so the badge width
           stays stable while the user picks. */
        #current_selection .cs-icon {
            width: 24px;
            height: 24px;
            background-image: var(--sprite-url);
            background-repeat: no-repeat;
            background-size: calc(var(--sprite-natural-w) * 24 / 64 * 1px) calc(var(--sprite-natural-w) * 24 / 64 * 1px);
            background-color: #061321;
            border-radius: 2px;
            flex-shrink: 0;
        }
        #current_selection .cs-name {
            text-transform: capitalize;
            letter-spacing: 0.3px;
        }
        #current_selection .cs-name.empty {
            color: #6b8aa8;
            font-style: italic;
            text-transform: none;
        }
        #current_selection .cs-caret {
            color: #6b8aa8;
            font-size: 11px;
            margin-left: 2px;
        }
        /* Native <select> respects the hidden attr already (UA stylesheet),
           but be explicit so authored toolbar styles can't override it. */
        #item_select[hidden] { display: none; }

        /* Modal overlay — covers everything (incl. the controls bar's z:10). */
        .picker-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 6, 18, 0.78);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .picker-overlay[hidden] { display: none; }

        /* Picker panel: very dark navy, gold/amber accent, soft blue glow.
           --icon-size drives the grid tile size; JS sets it on .open to
           fit the widest row into the current viewport width, clamped
           36-64px. The sprite is set by --sprite-url / --sprite-natural-w
           on body (per game); tile background scales by --icon-size / 64
           regardless of which sprite is active. */
        .picker-panel {
            --icon-size: 64px;
            background: #0a1828;
            color: #d4e6ff;
            border: 1px solid #1f3a5a;
            border-radius: 4px;
            width: min(95vw, 1280px);
            /* Fixed height (not max-) so hovering an item with many
               ingredients can't grow/shift the modal frame. Both panes
               scroll internally if their content exceeds this. */
            height: min(86vh, 760px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 80px rgba(60, 140, 220, 0.25);
        }

        .picker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: linear-gradient(180deg, #142c44, #0d2034);
            border-bottom: 1px solid #1f3a5a;
        }
        .picker-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #d4a64a;  /* DSP gold */
            text-transform: uppercase;
        }
        .picker-close {
            background: none;
            border: none;
            color: #d4e6ff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            padding: 0 6px;
        }
        .picker-close:hover { color: #d4a64a; }

        .picker-tabs {
            display: flex;
            background: #0c1f33;
            border-bottom: 1px solid #1f3a5a;
        }
        .picker-tab {
            background: none;
            border: none;
            color: #6b8aa8;
            padding: 10px 22px;
            font-size: 12px;
            letter-spacing: 1.8px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            text-transform: uppercase;
            font-family: inherit;
        }
        .picker-tab:hover { color: #d4e6ff; }
        .picker-tab.active {
            color: #d4a64a;
            border-bottom-color: #d4a64a;
        }

        .picker-body {
            display: flex;
            flex: 1;
            min-height: 0;  /* let inner panes scroll instead of expanding parent */
        }

        .picker-grid {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
        }
        .picker-row {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
        }
        /* Sprite cell rendered from the active game's icons.webp.
           --icon-size on the panel drives the tile box (set by JS to fit
           the widest row); --picker-sprite-size is ALSO set by JS to
           (icon_size / 64 * sprite_natural_w) px — precomputed because
           CSS calc() can't multiply two lengths. background-position is
           set inline per item (also scaled in JS). */
        .picker-item {
            width: var(--icon-size);
            height: var(--icon-size);
            background-image: var(--sprite-url);
            background-repeat: no-repeat;
            background-size: var(--picker-sprite-size) var(--picker-sprite-size);
            border: 1px solid #1f3a5a;
            border-radius: 3px;
            cursor: pointer;
            transition: border-color .12s, box-shadow .12s, transform .08s;
            background-color: #0d1f33;
            flex-shrink: 0;
        }
        .picker-item:hover {
            border-color: #5cc7ff;
            box-shadow: 0 0 12px rgba(92, 199, 255, 0.5);
            transform: translateY(-1px);
        }

        /* Side panel: shows hovered item's icon, name, time/output, ingredients. */
        .picker-side {
            width: 240px;
            padding: 18px 14px;
            background: #06121f;
            border-left: 1px solid #1f3a5a;
            overflow-y: auto;
            flex-shrink: 0;
        }
        /* Side-panel icons stay at native 64px regardless of grid scaling —
           the side is the "detail view" and the larger icon helps readability
           even when the grid tiles are shrunk. background-size locks the
           sprite to its natural dimensions so positions (in 64px-cell
           coordinates) line up exactly. */
        .picker-side-icon {
            width: 64px;
            height: 64px;
            background-image: var(--sprite-url);
            background-repeat: no-repeat;
            background-size: calc(var(--sprite-natural-w) * 1px) calc(var(--sprite-natural-w) * 1px);
            margin: 0 auto;
            border: 1px solid #1f3a5a;
            border-radius: 3px;
            background-color: #0d1f33;
        }
        .picker-side-name {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #d4a64a;
            text-transform: capitalize;
            margin: 10px 0 4px;
            letter-spacing: 0.5px;
        }
        .picker-side-meta {
            text-align: center;
            font-size: 11px;
            color: #6b8aa8;
            margin-bottom: 14px;
        }
        .picker-side h4 {
            font-size: 10px;
            color: #6b8aa8;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin: 8px 0 8px;
            text-transform: uppercase;
            border-bottom: 1px solid #1f3a5a;
            padding-bottom: 4px;
        }
        .picker-side-mat {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        /* Half-scale sprite cell for ingredient rows. Sprite drawn at half
           its natural width and JS halves the position string when
           rendering. background-size as a percentage would be relative to
           the element (32px), which is the wrong reference — must be in
           absolute units of the sprite's natural dimensions. */
        .picker-side-mat-icon {
            width: 32px;
            height: 32px;
            background-image: var(--sprite-url);
            background-repeat: no-repeat;
            background-size: calc(var(--sprite-natural-w) * 0.5px) calc(var(--sprite-natural-w) * 0.5px);
            border: 1px solid #1f3a5a;
            border-radius: 2px;
            background-color: #0d1f33;
            flex-shrink: 0;
        }
        .picker-side-mat-name {
            flex: 1;
            color: #d4e6ff;
            text-transform: capitalize;
            font-size: 12px;
            line-height: 1.2;
        }
        .picker-side-mat-count {
            color: #d4a64a;
            font-weight: 700;
            font-size: 13px;
            min-width: 28px;
            text-align: right;
        }
        .picker-hint {
            color: #6b8aa8;
            font-size: 12px;
            text-align: center;
            margin-top: 80px;
            font-style: italic;
        }
    </style>

    <script src="./sigma/sigma.min.js"></script>
    <script src="./sigma/plugins/sigma.layout.forceAtlas2.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.js"></script>
    <!-- ?v= cache-bust for the one-time stuck CDN response; once the gateway's
         new Cache-Control: no-store header is in place we don't need to bump
         this on subsequent iterations. -->
    <script src='./calculator.js?v=2'></script>
</head>

<body>
    <div class="controls">
        <select id="game_select"></select>
        <!-- Item dropdown — the source of truth for the current selection,
             but visually HIDDEN when the active game has the graphical
             picker (#current_selection takes over for chooser UX in that
             mode). Picker / current_selection write into item_select and
             fire .change() so everything downstream stays unchanged. -->
        <select id="item_select">
            <option></option>
        </select>
        <!-- Current-selection badge: shows when the active game has a
             graphical picker. Icon + name of the currently selected item;
             clicking opens the picker. Hidden in dropdown-only games
             (factorio today). The trailing ▾ chevron signals clickability
             since this is the only entry point into the picker now. -->
        <button id="current_selection" type="button"
                title="Change selection" hidden>
            <span class="cs-icon"></span>
            <span class="cs-name">Choose an item</span>
            <span class="cs-caret">▾</span>
        </button>
        <input id="items_per_sec" placeholder="Items Per Sec (Default: 1)" />
    </div>
    <div class="item_details">
        <!-- Left column: Recipe Picker — for each item in the current tree
             that has alternative recipes, shows a radio group. Replaces
             the old Total Materials panel (its info now lives in graph
             node hover tooltips). Populated by render_recipe_picker(). -->
        <div id="recipe_picker"></div>
        <!-- The header (h2 + reload button) and .graph-canvas are added
             by calculator.js on each render. The legend below is static —
             render_graph leaves it in place across re-renders so its
             open/closed state persists. -->
        <div id="graph">
            <details class="graph-legend" open>
                <summary>Legend</summary>
                <div class="graph-legend-body">
                    <div class="legend-item"><span class="legend-swatch" style="background:#4a9eff"></span>selected</div>
                    <div class="legend-item"><span class="legend-swatch" style="background:#ffe066"></span>collapsed</div>
                    <div class="legend-item"><span class="legend-swatch" style="background:#5cf089"></span>raw</div>
                    <div class="legend-item"><span class="legend-swatch" style="background:#7a99b8"></span>intermediate</div>
                </div>
            </details>
        </div>
    </div>

    <!-- Hover tooltip for graph nodes — populated and positioned by
         calculator.js on sigma's overNode event, hidden on outNode/click. -->
    <div id="node_tooltip" class="node-tooltip" hidden></div>

    <!-- Picker modal. Populated by JS when first opened, then re-rendered on
         tab switch. Backdrop click + Esc + the × button all close it. -->
    <div id="picker_overlay" class="picker-overlay" hidden>
        <div class="picker-panel" role="dialog" aria-label="Item picker">
            <header class="picker-header">
                <span class="picker-title">Replicator</span>
                <button id="picker_close" class="picker-close" type="button"
                        aria-label="Close">×</button>
            </header>
            <nav id="picker_tabs" class="picker-tabs"></nav>
            <div class="picker-body">
                <div id="picker_grid" class="picker-grid"></div>
                <aside id="picker_side" class="picker-side">
                    <p class="picker-hint">Hover an item</p>
                </aside>
            </div>
        </div>
    </div>
</body>

</html>
